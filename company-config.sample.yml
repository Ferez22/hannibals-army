# ==========================================
# COMPANY KNOWLEDGE CONFIG (v1.0)
# ==========================================
# This file is both a seed and a living artifact.
# Fill it manually at setup, then agents update it
# automatically as they learn from ingested documents.
#
# DO NOT rename top-level keys — agents reference them.
# _meta block is written by agents, do not edit manually.
# ==========================================

_meta:
  last_updated_by: "CARTOGRAPHER"       # agent that last wrote to this file
  last_updated_at: "2026-01-01T00:00:00"
  confidence_score: 1.0                  # drops if agents detect conflicts
  schema_version: "1.0"

# ==========================================
# COMPANY IDENTITY
# ==========================================

