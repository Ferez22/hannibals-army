  - name: "Bob Müller"
    email: "bob@acme.com"
    memberships:
      - team: "Engineering/Frontend"
        role: "Lead Developer"
        tasks: ["React", "design system"]
      - team: "Product Alpha"
        role: "Associate"
        tasks: ["write specs", "user testing"]
    skills: ["React", "TypeScript", "Figma"]
    tenure_since: "2023-06"

