# ==========================================
# RULES & POLICIES
# ==========================================
# Agents flag stale entries. notify_person receives validation request.
# valid_until: null means no expiry. Agents set this based on content.

rules:
  - id: "rule-001"
    category: "policy"
    title: "Remote Work Policy"
    content: "Employees may work remotely up to 3 days per week. Full remote requires manager approval."
    owner: "HR"
    notify_person: "maria@acme.com"
    valid_until: "2026-12-31"
    confidence_score: 1.0
    last_verified_at: "2026-01-10"
    source_document: "HR_Policy_2026.pdf"

  - id: "rule-002"
    category: "process"
    title: "Code Review Process"
    content: "All PRs require at least 1 approval from a senior engineer before merging to main."
    owner: "Engineering"
    notify_person: "john@acme.com"
    valid_until: null
    confidence_score: 0.9
    last_verified_at: "2025-09-15"
    source_document: "Engineering_Handbook.pdf"

  - id: "rule-003"
    category: "value"
    title: "Communication Standard"
    content: "Default to async communication. Slack for quick messages, Notion for documentation, meetings only when async fails."
    owner: "Leadership"
    notify_person: "jane@acme.com"
    valid_until: null
    confidence_score: 1.0
    last_verified_at: "2026-02-01"
    source_document: "Company_Handbook.pdf"

